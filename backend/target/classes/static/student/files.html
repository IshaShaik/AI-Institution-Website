<!doctype html><html><head><meta charset="utf-8"><title>My Files</title><link rel="stylesheet" href="../style.css"></head><body>
<div class="topbar"><div><strong>My Files</strong></div><div><a href="dashboard.html">Dashboard</a></div></div>
<div class="container"><h1>Available Files</h1><div id="list">Loading...</div></div>
<script src="auth-check.js"></script>
<script>
async function load(){
  const token = localStorage.getItem('token');
  if(!token){ window.location.href='/frontend/login.html'; return; }
  const res = await fetch('/api/student/files', {headers:{'Authorization':'Bearer '+token}});
  const data = await res.json();
  if(!res.ok){ document.getElementById('list').innerText = JSON.stringify(data); return;}
  if(data.length===0){ document.getElementById('list').innerText='No files yet.'; return; }
  const html = data.map(d=>{
    let content = '';
    if(d.type==='VIDEO'){
      let id = d.driveFileId;
      if(id.includes('drive.google.com')) {
        const m = id.match(/[-\w]{25,}/);
        if(m) id = m[0];
      }
      const src = id.startsWith('http') ? id : ('https://drive.google.com/file/d/'+id+'/preview');
      content = '<iframe src="'+src+'" width="640" height="360" allow="autoplay" frameborder="0"></iframe>';
    } else {
      content = '<a href="'+(d.driveFileId.startsWith('http')?d.driveFileId:('https://drive.google.com/uc?export=download&id='+d.driveFileId))+'" target="_blank">Download / Open</a>';
    }
    return '<div style="border:1px solid #eee; padding:12px; margin-bottom:10px;">'+
      '<h3>'+d.title+'</h3><p>'+d.description+'</p>'+content+'</div>';
  }).join('\n');
  document.getElementById('list').innerHTML = html;
}
load();
</script></body></html>
