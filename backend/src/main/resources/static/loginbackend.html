<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Academy</title>

  <style>
    /* ===== NAVBAR CSS ===== */
    .site-header {
      width: 100%;
      background: #0d0d0d;
      color: white;
      padding: 10px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: white;
    }

    .brand-text {
      font-size: 20px;
      color: #adadff;
      font-weight: 600;
    }

    .robot {
      font-size: 30px;
    }

    .nav-links {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
      color: white;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #c084fc;
    }
 .ai-btn {
  margin-left: 15px;       /* thoda kam gap */
  padding: 4px 8px;       /* padding chhota kiya */
  font-size: 13px;          /* font-size kam kiya */
  background: transparent;
  color: #00ff88;
  border: 1px solid #00ff88;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
  height: 40px;
  width: 90px;
  display: flex;
  justify-content: center;  /* horizontal center */
  align-items: center;      /* vertical center */
}

.ai-btn:hover {
  background: #00ff88;
  color: black;
}


    .nav-links .login {
      background: #6d28d9;
      padding: 8px 15px;
      border-radius: 6px;
    }

    .nav-links .login:hover {
      background: #8b5cf6;
    }

    /* 🤖 AI BUTTON (NAVBAR STYLE) */
    .ai-btn {
      margin-left: 20px;
      padding: 8px 14px;
      font-size: 15px;
      background: transparent;
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .ai-btn:hover {
      background: #00ff88;
      color: black;
    }

    /* ===== LOGIN PAGE CSS ===== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      display: flex;
    }

    .left {
      flex: 1;
      background-image: url('images/body.jpeg');
      background-size: cover;
      background-position: center;
    }

    .right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #f5f7fb;
      overflow: hidden;
    }

    .right::before,
    .right::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      background: #77d2df;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
    }

    .right::before {
      top: -60px;
      right: -40px;
    }

    .right::after {
      bottom: -60px;
      right: -40px;
    }

    h2 {
      position: absolute;
      top: 120px;
    }

    .login-box {
      width: 350px;
      height: 200px;
      padding: 35px;
      border-radius: 20px;
      position: absolute;
      top: 200px;
      border: 4px solid transparent;
      background:
        linear-gradient(#111, #111) padding-box,
        linear-gradient(135deg, #ff00ff, #00eaff, #ff9900) border-box;
      box-shadow:
        0 0 15px #ff00ff,
        0 0 30px #00eaff,
        0 0 45px #ff9900;
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      color: white;
      text-align: center;
    }

    input {
      width: 290px;
      padding: 12px;
      margin-bottom: 30px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #ff00ff;
      color: white;
      box-shadow: 0 0 10px #ff00ff;
    }

    button {
      width: 100px;
      padding: 12px;
      background: linear-gradient(90deg, #006aff, #00d0ff);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 15px #00cfff;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="navbar">
    <div class="brand">
      <div class="logo">AI <span class="robot">🤖</span></div>
      <div class="brand-text">AI Academy</div>
    </div>

    <nav class="nav-links">
      <a href="indexbackend.html">Home</a>
      <a href="syllabus.html">Syllabus</a>
      <a href="projects.html">Projects</a>
      <a href="company.html">Company</a>
      <a href="contact.html">Contact</a>

      <!-- 🤖 AI VOICE BUTTON -->
      <button id="aiToggleBtn" class="ai-btn">AI Voice ON</button>

      <a class="login" href="loginbackend.html">Login</a>
    </nav>
  </div>
</header>

<div class="content">
  <div class="left"></div>
  <div class="right">
    <h2>Welcome To Login Page</h2>
    <div class="login-box">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="pass" placeholder="Password">
      <button id="loginBtn">Login</button>
      <h6>Authorized Access Only</h6>
      <div id="err"></div>
    </div>
  </div>
</div>

<script>
/* 🤖 AI VOICE LOGIC */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

let aiEnabled = localStorage.getItem("aiEnabled") !== "false";
const btn = document.getElementById("aiToggleBtn");
btn.innerText = aiEnabled ? "AI Voice ON" : "AI Voice OFF";

btn.onclick = () => {
  aiEnabled = !aiEnabled;
  localStorage.setItem("aiEnabled", aiEnabled);
  btn.innerText = aiEnabled ? "AI Voice ON" : "AI Voice OFF";
};

const pageKey = "spoken_" + location.pathname;
if (aiEnabled && !localStorage.getItem(pageKey)) {
  const msg = new SpeechSynthesisUtterance(
    "Welcome to the login page. Please enter your email and password."
  );
  msg.lang = "en-IN";
  synth.speak(msg);
  localStorage.setItem(pageKey, "true");
}

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = true;
  recognition.start();

  recognition.onresult = (e) => {
    if (!aiEnabled) return;
    const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase();

    if (cmd.includes("home")) location.href = "indexbackend.html";
    else if (cmd.includes("syllabus")) location.href = "syllabus.html";
    else if (cmd.includes("project")) location.href = "projects.html";
    else if (cmd.includes("contact")) location.href = "contact.html";
  };
}

/* 🔐 LOGIN */
/* 🔐 LOGIN (FIXED WITH BACKEND) */
/* 🔐 LOGIN (FIXED WITH PROFILE SYNC) */
/* 🔐 LOGIN (FIXED FOR PROFILE PERSISTENCE) */
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const pass  = document.getElementById("pass").value;

  if(!email || !pass){
    document.getElementById("err").innerText = "Enter email and password";
    return;
  }

  try {
    const res = await fetch("http://localhost:8080/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: pass
      })
    });

    if(!res.ok){
      document.getElementById("err").innerText = "Invalid email or password";
      return;
    }

    const data = await res.json();
    
    console.log("Login Success Data:", data);

    /* ✅ LOGIC FIX: Pehle baaki data save karein */
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("userId", data.userId);
    localStorage.setItem("userName", data.name || data.userName); 
    
    /* 🛡️ PROFILE PHOTO PROTECTION: 
       Agar backend se photo mil rahi hai, sirf tabhi update karein. 
       Warna localStorage mein purani (updated) photo ko hi rehne dein. */
    const photoFromBackend = data.photo || data.userPhoto;
    
    if (photoFromBackend && photoFromBackend !== "" && photoFromBackend !== "null") {
        localStorage.setItem("userPhoto", photoFromBackend);
    } 
    // Agar photoFromBackend khali hai, toh hum 'userPhoto' ko touch nahi karenge
    // Taki ProgramHub page par aapka 'getUser' sync logic use handle kar le.

    /* Redirect to student portal */
    window.location.href = "student/programhub.html";

  } catch(e) {
    console.error(e);
    document.getElementById("err").innerText = "Server error";
  }
};

</script>

</body>
</html>
