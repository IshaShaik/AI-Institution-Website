<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Academy</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { max-width: 400px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; }
    button { width: 100%; padding: 10px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #45a049; }
    #err { color: red; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="pass" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div id="err"></div>
</div>

<script>
document.getElementById("loginBtn").addEventListener("click", async function() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    const errDiv = document.getElementById("err");

    errDiv.innerText = "";

    if(!email || !pass){
        errDiv.innerText = "Please fill all fields";
        return;
    }

    try {
        // -------- USE FULL BACKEND URL --------
        const res = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: pass })
        });

        const j = await res.json();

        if(!res.ok){
            errDiv.innerText = j.message || "Login failed";
            return;
        }

        // Save token in localStorage
        localStorage.setItem('token', j.token);

        // Redirect to student dashboard
        window.location.href = 'admin.html';

    } catch (err) {
        console.error(err);
        errDiv.innerText = "Server error. Try again later.";
    }
});
</script>

</body>
</html>
