<!DOCTYPE html>
<html>
<head>
    <title>Student Register</title>
    <style>
        body{
            font-family: Arial;
            background: #f4f4f4;
        }
        .box{
            width: 350px;
            margin: 80px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #msg{color:red;text-align:center;margin-top:10px;}
    </style>
</head>

<body>

<div class="box">
    <h2>Register</h2>

    <input type="text" placeholder="Name" id="name">
    <input type="email" placeholder="Email" id="email">
    <input type="password" placeholder="Password" id="pass">
    <input type="text" id="college" placeholder="College / School Name">
<input type="text" id="class" placeholder="Class (11 / 12)">
<input type="text" id="section" placeholder="Section (A/B)">


    <button id="registerBtn">Register</button>

    <p id="msg"></p>
</div>

<script>
document.getElementById("registerBtn").addEventListener("click", async function(){
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    const college = document.getElementById("college").value;
    const studentClass = document.getElementById("class").value;
    const section = document.getElementById("section").value;

    if(!email || !pass || !name || !college || !studentClass || !section){
        document.getElementById("msg").innerText = 'Please fill all fields';
        return;
    }

    try {
        const res = await fetch("http://localhost:8080/api/auth/register", {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                name: name,
                email: email,
                password: pass,
                role: "STUDENT",
                collegeName: college,
                studentClass: studentClass,
                section: section
            })
        });

        const j = await res.json();
        document.getElementById("msg").innerText = j.message;

        if(res.ok){
            window.location.href = "login.html";
        }

    } catch(err){
        console.error(err);
        document.getElementById("msg").innerText = "Error connecting to server";
    }
});
</script>

</body>
</html>
