<!doctype html><html><head><meta charset="utf-8"><title>Contact</title><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar"><div><strong>AI Academy</strong></div><div><a href="index.html">Home</a><a href="syllabus.html">Syllabus</a><a href="projects.html">Projects</a><a href="company.html">Company</a><a href="contact.html">Contact</a><a id="loginLink" href="login.html">Login</a></div></div>
<div class="container"><h1>Contact Us</h1><p>Phone: +91-9731860180</p><p>Email: ishashaik1509@gmail.com</p><h3>Send a message (demo)</h3>
<form id="contactForm"><input placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:8px;"><input placeholder="Your Email" style="width:100%; padding:10px; margin-bottom:8px;"><textarea placeholder="Your Message" style="width:100%; padding:10px; height:120px;"></textarea><br><button class="btn" type="button" onclick="sendContact()">Send Message</button></form></div>
<script>
if (localStorage.getItem("token")) { document.getElementById("loginLink").href = "student/dashboard.html"; document.getElementById("loginLink").innerText = "Dashboard"; }
function sendContact(){
  const name = document.querySelector('#contactForm input').value || '';
  const email = document.querySelectorAll('#contactForm input')[1].value || '';
  const message = document.querySelector('#contactForm textarea').value || '';
  fetch('/api/contact/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,email:email,message:message})})
    .then(r=>r.json()).then(j=>{ alert('Message received'); })
    .catch(e=>{ alert('Error');});
}
</script></body></html>
