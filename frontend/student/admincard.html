<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Exam Controller</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #9d50bb;
            --bg: #0a0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            margin: 0;
            font-size: 28px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .publish-btn {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .publish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header">
            <i class="fas fa-user-shield" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2>Assessment Controller</h2>
            <p style="color: #666; font-size: 14px;">Update live exam details for students</p>
        </div>

        <div class="form-group">
            <label><i class="fas fa-layer-group"></i> Level Name</label>
            <input type="text" id="lvl" value="Level 1: Robotics Foundation">
        </div>

        <div class="form-group">
            <label><i class="fas fa-sitemap"></i> Part Name</label>
            <input type="text" id="prt" value="Part A: Electronic Components">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label><i class="fas fa-book"></i> Module</label>
                <input type="text" id="mod" placeholder="e.g. Module 3">
            </div>
            <div class="form-group">
                <label><i class="fas fa-microchip"></i> Topic</label>
                <input type="text" id="top" placeholder="e.g. Ultrasonic Sensors">
            </div>
        </div>

        <div class="grid-3" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Questions</label>
                <input type="number" id="qs" value="20">
            </div>
            <div class="form-group">
                <label>Time (Min)</label>
                <input type="text" id="tm" value="60 Minutes">
            </div>
            <div class="form-group">
                <label>Passing %</label>
                <input type="text" id="ps" value="12/20 (60%)">
            </div>
        </div>

        <button class="publish-btn" onclick="publishExamData()">
            <i class="fas fa-paper-plane"></i> PUBLISH LIVE EXAM
        </button>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        async function publishExamData() {
            const btn = document.querySelector('.publish-btn');
            const status = document.getElementById('status');
            
            const examData = {
                levelName: document.getElementById('lvl').value,
                partName: document.getElementById('prt').value,
                moduleName: document.getElementById('mod').value,
                topicName: document.getElementById('top').value,
                totalQuestions: parseInt(document.getElementById('qs').value),
                timeLimit: document.getElementById('tm').value,
                passingScore: document.getElementById('ps').value
            };

            // Button loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PUBLISHING...';
            btn.style.opacity = '0.7';

            try {
                const response = await fetch('http://localhost:8080/api/exam/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(examData)
                });

                if (response.ok) {
                    status.style.display = 'block';
                    status.style.color = '#00ff88';
                    status.innerHTML = "✅ Database Updated Successfully! Students can see the changes.";
                } else {
                    throw new Error("Server Error");
                }
            } catch (error) {
                status.style.display = 'block';
                status.style.color = '#ff4d4d';
                status.innerHTML = "❌ Connection Failed! Make sure Spring Boot is running.";
                console.error("Error:", error);
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> PUBLISH LIVE EXAM';
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
