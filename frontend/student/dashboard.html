<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        .progress-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            margin-top: 40px;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 6px;
            margin-top: 20px;
            position: relative;
        }

        .car {
            width: 40px;
            height: 20px;
            background: red;
            position: absolute;
            top: -5px;
            left: 0%;
            transition: left 1s ease-out;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h2>Welcome to Dashboard</h2>

<div class="progress-box">
    <h3>Your Progress</h3>

    <div class="progress-track">
        <div id="car" class="car"></div>
    </div>

    <p id="percent" style="font-size:20px; margin-top:15px;">Loading...</p>

    <button class="btn" onclick="completeLesson()">+10% Complete</button>
</div>

<script>
async function loadProgress() {
    const token = localStorage.getItem("token");

    const res = await fetch("/api/student/progress", {
        headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();
    const p = data.progress;

    document.getElementById("percent").innerText = p + "%";

    const car = document.getElementById("car");
    car.style.left = p + "%";
}

async function completeLesson() {
    const token = localStorage.getItem("token");

    const current = parseInt(document.getElementById("percent").innerText);
    const updated = Math.min(100, current + 10);

    await fetch("/api/student/progress/update", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ progress: updated })
    });

    loadProgress();
}

loadProgress();
</script>

</body>
</html>
