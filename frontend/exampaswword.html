<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set Exam Password</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #ffffff;
        width: 380px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .card h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e293b;
    }

    label {
        font-size: 14px;
        color: #334155;
        margin-bottom: 6px;
        display: block;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #cbd5f5;
        margin-bottom: 15px;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: #6366f1;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        border: none;
        border-radius: 8px;
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #4338ca;
    }

    #msg {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: green;
        font-weight: 500;
    }

    .note {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
        color: #64748b;
    }
</style>
</head>

<body>

<div class="card">
    <h2>🔐 Set Exam Password</h2>

    <label>Level ID</label>
    <input type="number" id="levelId" placeholder="Enter Level ID">

    <label>Part ID</label>
    <input type="number" id="partId" placeholder="Enter Part ID">

    <label>Module ID</label>
    <input type="number" id="moduleId" placeholder="Enter Module ID">

    <label>Password</label>
    <input type="text" id="password" placeholder="Enter Exam Password">

    <button onclick="savePassword()">Save Password</button>

    <p id="msg"></p>

    <div class="note">
        Same password will apply to Set A / B / C
    </div>
</div>

<script>
function savePassword() {

    if(
        !levelId.value ||
        !partId.value ||
        !moduleId.value ||
        !password.value
    ){
        document.getElementById("msg").style.color = "red";
        document.getElementById("msg").innerText = "⚠️ All fields are required";
        return;
    }

    fetch("http://localhost:8080/api/admin/exam-password/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            levelId: levelId.value,
            partId: partId.value,
            moduleId: moduleId.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("msg").style.color = "green";
        document.getElementById("msg").innerText = data.message;
    })
    .catch(() => {
        document.getElementById("msg").style.color = "red";
        document.getElementById("msg").innerText = "Server error";
    });
}
</script>

</body>
</html>
